<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPDA — Welcome</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{ --muted:#a7b3e6; }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: radial-gradient(ellipse 1200px 800px at 50% 40%, #1c2f78, #0a1230 65%), #060a1c;
    overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    color:#f4f6ff;
    display:flex; align-items:center; justify-content:center;
  }
  .stage{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:100%; height:100vh;
    position:relative;
  }

  .particles{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .particle{
    position:absolute; border-radius:50%;
    background: rgba(255,255,255,0.5);
    opacity:0;
    animation: drift linear infinite;
  }

  .art{
    position:relative;
    width:min(62vw, 70vh);
    aspect-ratio: 790/540;
  }
  .glow{
    position:absolute; inset:-14%;
    background: radial-gradient(circle, rgba(140,170,255,0.0), transparent 62%);
    filter: blur(18px);
    animation: glowIn 1.1s ease-out 1.5s forwards;
  }
  .mosaic{
    position:absolute; inset:0;
    -webkit-mask-image: radial-gradient(ellipse 58% 64% at 50% 50%, black 58%, transparent 97%);
            mask-image: radial-gradient(ellipse 58% 64% at 50% 50%, black 58%, transparent 97%);
  }
  .mosaic.idle{ animation: floaty 6.5s ease-in-out 2s infinite; }

  .tile.center{
    opacity:1;

  }
  .shine{
    position:absolute; inset:0;
    -webkit-mask-image: radial-gradient(ellipse 58% 64% at 50% 50%, black 58%, transparent 97%);
            mask-image: radial-gradient(ellipse 58% 64% at 50% 50%, black 58%, transparent 97%);
    background: linear-gradient(112deg,
      transparent 34%, rgba(255,255,255,0) 44%,
      rgba(255,255,255,0.8) 49%, rgba(255,255,255,0.9) 51%,
      rgba(255,255,255,0) 56%, transparent 66%);
    background-size: 260% 260%;
    background-position: -70% -70%;
    mix-blend-mode: overlay;
    opacity:0;
    animation: sweepIn 0.3s linear 1.9s forwards, sweep 3.2s ease-in-out 2.2s infinite;
    pointer-events:none;
  }

  .copy{
    text-align:center;
    margin-top:34px;
    opacity:0;
    transform: translateY(14px);
    animation: riseIn .8s ease-out 2.15s forwards;
  }
  .copy h1{
    margin:0 0 6px;
    font-family: Georgia, 'Playfair Display', serif;
    font-size: clamp(26px,3.4vw,38px);
  }
  .copy p{ margin:0; color:var(--muted); font-size:14px; }

  @keyframes glowIn{ to{ background: radial-gradient(circle, rgba(140,170,255,0.4), transparent 62%); } }
  @keyframes floaty{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-11px); } }
  @keyframes riseIn{ to{ opacity:1; transform: translateY(0); } }
  @keyframes sweepIn{ to{ opacity:1; } }
  @keyframes sweep{
    0%{ background-position: -70% -70%; }
    45%{ background-position: 170% 170%; }
    100%{ background-position: 170% 170%; }
  }
  @keyframes drift{
    0%{ transform: translateY(0); opacity:0; }
    10%{ opacity:0.6; } 90%{ opacity:0.3; }
    100%{ transform: translateY(-120px); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="particles" id="particles"></div>
  <div class="art">
    <div class="glow"></div>
    <div class="mosaic idle" id="mosaic"></div>
    <div class="shine"></div>
  </div>
  <div class="copy">
    <h1>Welcome to SPDA</h1>
    <p>Shaping the future of the Southern Province</p>
  </div>
</div>

<style id="tile-frames"></style>
<script>
  const COLS = 12, ROWS = 9;
  const mosaic = document.getElementById('mosaic');
  const frameSheet = document.getElementById('tile-frames');
  let css = '';

  // region (fraction of art box) that holds the crest + "SPDA" pill — stays fixed, never flies
  const CENTER_X = [0.36, 0.70];
  const CENTER_Y = [0.00, 0.63];

  const W = 790, H = 540; // reference art aspect box used for angle math
  const centerPxX = W/2, centerPxY = H/2;

  let idx = 0;
  for(let r=0; r<ROWS; r++){
    for(let c=0; c<COLS; c++){
      const fx = c/(COLS-1);
      const fy = r/(ROWS-1);
      const isCenter = fx >= CENTER_X[0] && fx <= CENTER_X[1] && fy >= CENTER_Y[0] && fy <= CENTER_Y[1];

      const tile = document.createElement('div');
      tile.className = 'tile' + (isCenter ? ' center' : '');
      const wPct = 100/COLS, hPct = 100/ROWS;
      tile.style.left = (c*wPct)+'%';
      tile.style.top = (r*hPct)+'%';
      tile.style.width = wPct+'%';
      tile.style.height = hPct+'%';
      tile.style.backgroundSize = (COLS*100)+'% '+(ROWS*100)+'%';
      tile.style.backgroundPosition = (COLS<=1?0:(c/(COLS-1))*100)+'% '+(ROWS<=1?0:(r/(ROWS-1))*100)+'%';

      if(!isCenter){
        // final offset of this tile's center from the overall art center, in px (reference box)
        const px = (fx*W) - centerPxX;
        const py = (fy*H) - centerPxY;
        const radius0 = Math.hypot(px,py) || 1;
        const angle0 = Math.atan2(py,px);

        const dir = (c < COLS/2) ? -1 : 1; // swirl direction: left half one way, right half the other
        const rotOffset = (120 + Math.random()*90) * (Math.PI/180) * dir;
        const radiusScale = 1.9 + Math.random()*0.9;
        const selfSpinStart = (Math.random()*70 - 35) * dir;

        const steps = [0, 0.12, 0.28, 0.46, 0.64, 0.8, 0.92, 1];
        const easeOutCubic = t => 1 - Math.pow(1-t, 3);

        const animName = 'fly'+idx;
        let body = '';
        steps.forEach((t, i) => {
          const te = easeOutCubic(t);
          const ang = angle0 + rotOffset * (1-te);
          const rad = radius0 * (1 + (radiusScale-1) * (1-te));
          const curX = Math.cos(ang) * rad;
          const curY = Math.sin(ang) * rad;
          const dx = curX - px;
          const dy = curY - py;
          const spin = selfSpinStart * (1-te);
          const scale = 0.4 + 0.6*te;
          const opacity = t < 0.18 ? (t/0.18) : 1;
          const pct = Math.round(t*100);
          body += `${pct}%{ opacity:${opacity.toFixed(2)}; transform: translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) rotate(${spin.toFixed(1)}deg) scale(${scale.toFixed(2)}); }\n`;
        });
        css += `@keyframes ${animName}{\n${body}}\n`;

        const delay = (0.10 + (radius0/Math.hypot(centerPxX,centerPxY))*0.35 + Math.random()*0.12).toFixed(2);
        tile.style.animationName = animName;
        tile.style.animationDuration = '1.3s';
        tile.style.animationDelay = delay+'s';
      }

      mosaic.appendChild(tile);
      idx++;
    }
  }
  frameSheet.textContent = css;

  const pWrap = document.getElementById('particles');
  for(let i=0;i<26;i++){
    const d = document.createElement('div');
    d.className='particle';
    const size = 1.5 + Math.random()*2.5;
    d.style.width = size+'px'; d.style.height = size+'px';
    d.style.left = Math.random()*100+'%';
    d.style.top = 55 + Math.random()*45+'%';
    d.style.animationDuration = (6+Math.random()*8)+'s';
    d.style.animationDelay = (Math.random()*8)+'s';
    pWrap.appendChild(d);
  }
</script>
<script src="spda-features.js"></script>
</body>
